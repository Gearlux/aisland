# =========================================================================
# HAND-WRITTEN workflow — NOT generated by `aisland jenkins scaffold`.
# (ci.yml / Jenkinsfile are generated; this release pipeline is separate so
# regeneration never clobbers it.)
#
# Publishes the `aisland` distribution to PyPI when a version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Uses PyPI Trusted Publishing (OIDC, no stored API token). One-time setup on
# https://pypi.org/manage/account/publishing/ — add a "pending publisher":
#   PyPI project name: aisland
#   Owner:             Gearlux
#   Repository:        aisland
#   Workflow name:     release.yml
#   Environment:       pypi
#
# Pinned by tests/test_packaging.py (the trigger, the gates and tests the build
# waits on, the tag guard run against a pyproject.toml, the main guard and the
# CHANGELOG guard run in a scratch repository, the strict check, the smoke
# test, Trusted Publishing).
# =========================================================================
name: Release to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  # The tag's commit passes the quality gates and BOTH test runs before anything is built: a tag pushed from a
  # commit CI never checked, or checked red, never reaches PyPI.
  # Every Python version the package's classifiers claim; the build below runs on one.
  tests:
    name: Quality gates & every test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: Install dependencies
      run: uv pip install --system -e ".[dev]"
    - name: Run Isort
      run: isort --check-only .
    - name: Run Black
      run: black --check .
    - name: Run Flake8
      run: flake8 .
    - name: Run Mypy
      run: mypy .
    - name: Run the fast and the slow tests
      run: pytest tests -m ''

  build:
    name: Build & verify distribution
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # the whole history, so the guard below can tell whether main holds the tagged commit
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install packaging toolchain
      run: python -m pip install build twine
    - name: Guard - tag matches pyproject version
      run: |
        PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
        if [ "v$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $PKG_VERSION"
          exit 1
        fi
    # A release is made from main: a tag on a commit of another branch (dev/main, a topic branch) is refused, so PyPI
    # never ships a commit main does not hold and the README's links to the tag show what main shows.
    - name: Guard - the tagged commit is on main
      run: |
        git fetch --no-tags --quiet origin main
        if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
          echo "::error::Tag $GITHUB_REF_NAME is on a commit main does not hold: merge it into main, then tag the commit there"
          exit 1
        fi
    # The date is the tagged commit's: a heading written days before the tag (or never updated) is refused.
    - name: Guard - the CHANGELOG dates this version
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        DATE=$(git log -1 --format=%cs HEAD)
        if ! grep -Eq "^## \[${VERSION//./\\.}\] - ${DATE}$" CHANGELOG.md; then
          echo "::error::CHANGELOG.md does not date $VERSION as its tagged commit: write its heading as '## [$VERSION] - $DATE'"
          exit 1
        fi
    - name: Build sdist + wheel
      run: python -m build
    - name: Check package metadata
      run: python -m twine check --strict dist/*
    - name: Smoke-test the built wheel in a clean venv
      run: |
        python -m venv /tmp/smoke
        /tmp/smoke/bin/pip install --quiet dist/*.whl
        cd /tmp
        /tmp/smoke/bin/aisland --help > /dev/null
        /tmp/smoke/bin/aisland --version | grep -qx "aisland, version ${GITHUB_REF_NAME#v}"
        /tmp/smoke/bin/python -P -c "import aisland; assert aisland.__version__ not in ('', '0.0.0.dev0'); print('version', aisland.__version__)"
        GIT_CONFIG_GLOBAL=/dev/null /tmp/smoke/bin/aisland workspace init smoke-workspace
        test -d smoke-workspace/.git
        test -f smoke-workspace/.agents/aisland/AGENTS.md
        echo "wheel smoke-test OK"
    - uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write  # required for PyPI Trusted Publishing (OIDC)
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    - name: Publish
      uses: pypa/gh-action-pypi-publish@release/v1
