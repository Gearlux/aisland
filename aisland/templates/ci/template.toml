# aisland's own CI template set: what `aisland jenkins scaffold` writes when the workspace names no other.
# Copy it to start a set of your own: aisland jenkins templates export ci-templates
#
# [files] maps each file the set writes, relative to the project, to its template here; a template no file names
# (the `_*.jinja` pieces) is only included by the others. Values: <[ fact ]>, logic: <% if … %>, comments: <# … #>.
# [variables] declares a set's own settings — `name = { default = "…", help = "…" }`, without a default required —
# which a workspace sets in workspace.toml's [ci.variables] and a project in its own `ci = { name = "…" }`.

format = 1  # the shape of this file; an aisland too old for a set's format refuses it, naming the upgrade

[files]
"Jenkinsfile.local" = "Jenkinsfile.local.jinja"
"Jenkinsfile" = "Jenkinsfile.jinja"
".github/workflows/ci.yml" = "ci.yml.jinja"

[variables]
# The Python versions ci.yml's unit tests run on, space-separated: several run as a matrix, one job each, and every
# other job runs on the first. A project that claims more Pythons sets its own in workspace.toml:
# [project."app"] ci = { python_versions = "3.12 3.13" }
python_versions = { default = "3.12", help = "the Python versions ci.yml's unit tests run on, space-separated; the other jobs run on the first" }
