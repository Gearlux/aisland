[mypy]
ignore_missing_imports = True
exclude = data|$\.venv
# Global-only (mypy refuses it in a module section): holds the tests too.
warn_redundant_casts = True

# The package is held to what `mypy --strict` checks, except `no_implicit_reexport` (the tests patch `module.subprocess`
# and the like); the tests are not held to it. `--strict` itself is a global-only switch, so its flags are named here for
# the package alone — the first keeps the package naming what its containers hold (`Dict[str, McpServer]`, never a bare
# `dict`).
[mypy-aisland,aisland.*]
disallow_any_generics = True
disallow_subclassing_any = True
disallow_untyped_calls = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
warn_unused_ignores = True
warn_return_any = True
strict_equality = True
extra_checks = True
