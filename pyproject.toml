[build-system]
# setuptools>=77 is the PEP 639 floor: `license` as a plain SPDX string below requires it (the TOML-table
# form is deprecated). Pinned by tests/test_packaging.py::test_a_release_build_prints_no_deprecation_warning.
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aisland"
version = "0.1.0"
description = "One workspace of many Python projects: a shared venv, local services, generated CI and git aliases."
readme = "README.md"
authors = [{name = "Gert Behiels"}]
# PEP 639 SPDX expression; no `License ::` classifier (setuptools warns on one beside this field).
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.0.0",
    # Generates the process-compose desired-state document (aisland/supervisor.py).
    "pyyaml>=6.0",
    # PEP 508 requirement parsing for the CI scaffolder's internal-dep closure
    # (services/jenkins.py) — an extras-carrying spec like `matrainer[keras]>=0.1.0`
    # must resolve to its dep and the named extra, which a regex split cannot do.
    "packaging>=23.0",
]
requires-python = ">=3.12"

[project.optional-dependencies]
# `aisland tunnel connect` speaks the VS Code tunnel's MessagePack messages (aisland/tunnel_connect.py);
# only the machine you connect FROM needs it, so it stays out of the base install.
connect = ["msgpack>=1.2"]
# `aisland-mcp`, the MCP server (aisland/server.py): only a machine whose AI client calls aisland's tools needs it.
mcp = ["mcp>=2.0"]
# What CI installs (`.[dev]`): the [connect] and [mcp] extras' packages, so their tests run — spelled out, not
# `<name>[connect]`, so the line never depends on the distribution's name.
dev = [
    "msgpack>=1.2",
    "mcp>=2.0",
    # `aisland completion install` hands liquifai apps to liquifai (aisland/completion.py), and its tests stub that.
    "liquifai>=0.3.1",
    # The quality gates ci.yml and the Jenkinsfiles run.
    "pytest>=8.0,<9.0",
    "pytest-cov>=6.0",
    "black>=24.0,<25.0",
    "isort>=5.13,<6.0",
    "flake8>=7.0",
    # Below 2.0, as the workspace's other projects pin it.
    "mypy>=1.20,<2.0",
    "types-PyYAML>=6.0",
    # The release build and PyPI's own check (tests/test_packaging.py builds and checks the release).
    "build>=1.5",
    "twine>=7.0",
    # Those tests (and tests/test_wheels.py's end-to-end ones) build WITHOUT isolation, so the build backend
    # must already be in the venv — a fresh one has neither.
    "setuptools>=77.0",
    "wheel",
    # tests/test_wheels.py's end-to-end tests run the real uv found beside the interpreter, where this puts it.
    "uv>=0.12",
]

[project.urls]
Homepage = "https://github.com/Gearlux/aisland"
Repository = "https://github.com/Gearlux/aisland.git"
Issues = "https://github.com/Gearlux/aisland/issues"
Changelog = "https://github.com/Gearlux/aisland/blob/main/CHANGELOG.md"

[project.scripts]
aisland = "aisland.cli:main"
# The MCP server; `aisland setup` lists it in `.mcp.json` (a `<pkg>.server:main` script importing `mcp.server`).
aisland-mcp = "aisland.server:main"

# Every pytest run in the workspace `.venv` loads this plugin, which records each run of a
# workspace project to `aisland/data/test-stats/` (aisland rules → "Two Test Runs"; read back by
# `aisland tests report`). Disable it for one run with `-p no:aisland_test_stats`.
[project.entry-points.pytest11]
aisland_test_stats = "aisland.pytest_stats"

[tool.setuptools.packages.find]
where = ["."]
include = ["aisland*"]

# The non-Python files the package reads or runs, so a wheel carries them:
# the workspace-file template (manager.write_code_workspace), the git alias scripts and the
# files `aisland workspace init` writes (aisland/workspace.py), and the agent harness `aisland setup` installs
# into every workspace (aisland/harness.py: the commands, their helper script, the generic rules — `harness/` is no
# Python package, so its script is data too). setup.py adds project.bashrc.
[tool.setuptools.package-data]
aisland = ["py.typed", "code-workspace.json", "git/*.sh", "templates/*", "harness/*.md", "harness/commands/*.md", "harness/scripts/*.py"]

[tool.black]
line-length = 120
extend-exclude = 'data/'

[tool.isort]
profile = "black"
line_length = 120
skip_glob = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = ["data", ".venv"]
