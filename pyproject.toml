[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sandbox-manager"
version = "0.1.0"
description = "Development Infrastructure Sandbox Manager"
authors = [{name = "gearlux"}]
license = {text = "MIT"}
dependencies = [
    "click>=8.0.0",
]
requires-python = ">=3.8"

[project.scripts]
sandbox = "sandbox.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sandbox*"]

[tool.black]
line-length = 120
extend-exclude = 'data/'

[tool.isort]
profile = "black"
line_length = 120
skip_glob = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
