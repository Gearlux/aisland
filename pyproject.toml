[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aisland-manager"
version = "0.1.0"
description = "Development Infrastructure Aisland Manager"
authors = [{name = "gearlux"}]
license = {text = "MIT"}
dependencies = [
    "click>=8.0.0",
]
requires-python = ">=3.12"

[project.scripts]
aisland = "aisland.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aisland*"]

[tool.black]
line-length = 120
extend-exclude = 'data/'

[tool.isort]
profile = "black"
line_length = 120
skip_glob = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = ["data", ".venv"]

[tool.aisland.sys-dependencies]
brew = ["openjdk", "swiftbar", "act", "docker", "colima"]
