[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aisland-manager"
version = "0.1.0"
description = "Development Infrastructure Aisland Manager"
authors = [{name = "Acme"}]
license = {text = "MIT"}
dependencies = [
    "click>=8.0.0",
    # Generates the process-compose desired-state document (aisland/supervisor.py).
    "pyyaml>=6.0",
    # PEP 508 requirement parsing for the CI scaffolder's internal-dep closure
    # (services/jenkins.py) — an extras-carrying spec like `matrainer[keras]>=0.1.0`
    # must resolve to its dep and the named extra, which a regex split cannot do.
    "packaging>=23.0",
]
requires-python = ">=3.12"

[project.scripts]
aisland = "aisland.cli:main"

# Every pytest run in the workspace `.venv` loads this plugin, which records each run of a
# workspace project to `aisland/data/test-stats/` (aisland rules → "Two Test Runs"; read back by
# `aisland tests report`). Disable it for one run with `-p no:aisland_test_stats`.
[project.entry-points.pytest11]
aisland_test_stats = "aisland.pytest_stats"

[tool.setuptools.packages.find]
where = ["."]
include = ["aisland*"]

# The non-Python files the package reads or runs, so a wheel carries them:
# the workspace-file template (manager.write_code_workspace), the git alias scripts and the
# files `aisland workspace init` writes (aisland/workspace.py), and the agent harness `aisland setup` installs
# into every workspace (aisland/harness.py: the commands, their helper script, the generic rules — `harness/` is no
# Python package, so its script is data too). setup.py adds project.bashrc.
[tool.setuptools.package-data]
aisland = ["code-workspace.json", "git/*.sh", "templates/*", "harness/*.md", "harness/commands/*.md", "harness/scripts/*.py"]

[tool.black]
line-length = 120
extend-exclude = 'data/'

[tool.isort]
profile = "black"
line_length = 120
skip_glob = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = ["data", ".venv"]

[tool.aisland.sys-dependencies]
# f1bonacc1/tap/process-compose: the service supervisor (aisland/supervisor.py)
# — tap-qualified because homebrew-core has no process-compose formula.
# Linux gets it from the userspace registry (manager.USERSPACE_TOOLS) instead.
# No `openjdk`: that formula follows the newest Java, which Jenkins refuses. Setup installs the
# `openjdk@N` the Jenkins WAR names instead (aisland/services/jenkins_java.py).
brew = ["swiftbar", "act", "docker", "colima", "f1bonacc1/tap/process-compose"]
userspace = ["process-compose"]
